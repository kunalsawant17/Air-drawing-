<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Drawing Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#050505;
    overflow:hidden;
}

video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:block;
    z-index:0;
    transform:scaleX(-1);
}
    
#canvas{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:1;
    background:transparent;
}
#threeContainer{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:2;
    pointer-events:none;
    }

#toolbar{
    position:fixed;
    top:15px;
    left:15px;
    z-index:9999;
    background:rgba(20,20,20,0.9);
    border:1px solid #00ffff50;
    border-radius:12px;
    padding:12px;
    display:flex;
    gap:10px;
    align-items:center;
    backdrop-filter:blur(10px);
}

#status{
    color:#00ffff;
    font-weight:bold;
    min-width:90px;
}

button{
    padding:8px 12px;
    background:#111;
    color:white;
    border:1px solid #00ffff;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#222;
}
select{
    padding:8px;
    border:none;
    border-radius:6px;
    background:#111;
    color:white;
    }
#searchBox{
    width:180px;
    padding:8px;
    border:none;
    border-radius:6px;
    background:#111;
    color:white;
}

#searchBtn{
    padding:8px 12px;
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<video class="input_video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
    <div id="threeContainer"></div>
<div id="toolbar">
    <span id="status">Loading...</span>

    <input type="color" id="colorPicker" value="#00ffff">

    <input type="range"
           id="sizeSlider"
           min="2"
           max="30"
           value="8">

    <button id="clearBtn">Clear</button>
    <button id="addObject">+ Object</button>
    <input
type="text"
id="searchBox"
placeholder="Search car, bike, cpu..."
>

<script>
const videoElement = document.querySelector('.input_video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const colorPicker = document.getElementById('colorPicker');
const sizeSlider = document.getElementById('sizeSlider');
const statusText = document.getElementById('status');

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let lastX = null;
let lastY = null;

function fingerUp(lm, tip, pip){
    return lm[tip].y < lm[pip].y;
}

function countFingers(lm){

    let count = 0;

    if(fingerUp(lm,8,6)) count++;
    if(fingerUp(lm,12,10)) count++;
    if(fingerUp(lm,16,14)) count++;
    if(fingerUp(lm,20,18)) count++;

    if(lm[4].x > lm[3].x){
        count++;
    }

    return count;
}

function drawGlow(x,y,px,py){

    const color = colorPicker.value;
    const size = parseInt(sizeSlider.value);

    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.shadowBlur = size * 3;
    ctx.shadowColor = color;

    ctx.beginPath();
    ctx.moveTo(px,py);
    ctx.lineTo(x,y);
    ctx.stroke();
}

document.getElementById('clearBtn').onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
};

function onResults(results){

    if(!results.multiHandLandmarks ||
       results.multiHandLandmarks.length===0){

        lastX = null;
        lastY = null;
        statusText.innerText="No Hand";
        return;
    }

    const lm = results.multiHandLandmarks[0];

    const fingers = countFingers(lm);

    const x = (1-lm[8].x)*canvas.width;
    const y = lm[8].y*canvas.height;

    if(fingers===1){

        statusText.innerText="Drawing";

        if(lastX!==null){
            drawGlow(x,y,lastX,lastY);
        }

        lastX = x;
        lastY = y;

    }
    else if(fingers>=4){

        statusText.innerText="Erasing";

        ctx.save();
        ctx.globalCompositeOperation="destination-out";

        ctx.beginPath();
        ctx.arc(x,y,40,0,Math.PI*2);
        ctx.fill();

        ctx.restore();

        lastX = null;
        lastY = null;
    }
    else if(fingers===0){

        statusText.innerText="Paused";

        lastX = null;
        lastY = null;
    }
    else{

        statusText.innerText="Ready";

        lastX = null;
        lastY = null;
    }
}

const hands = new Hands({
    locateFile:(file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.7
});

hands.onResults(onResults);

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        videoElement.srcObject = stream;

        videoElement.onloadedmetadata = async () => {
            await videoElement.play();

            async function detectFrame() {
                await hands.send({ image: videoElement });
                requestAnimationFrame(detectFrame);
            }

            detectFrame();
        };

    } catch (err) {
        statusText.innerText = "Camera Error";
        console.error(err);
    }
}

startCamera();
    const scene = new THREE.Scene();

const camera3D = new THREE.PerspectiveCamera(
75,
window.innerWidth / window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
alpha:true,
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document
.getElementById("threeContainer")
.appendChild(renderer.domElement);

camera3D.position.z = 5;

const light = new THREE.AmbientLight(
0xffffff,
2
);

scene.add(light);

let activeObject = null;
    const objectMap = {

car:"cube",

bike:"sphere",

cpu:"cylinder",

motherboard:"cube",

gpu:"cube",

ram:"cylinder",

drone:"sphere"

};

document
.getElementById("addObject")
.onclick = () => {

if(activeObject){
scene.remove(activeObject);
}

const searchValue =
document.getElementById("searchBox")
.value
.toLowerCase()
.trim();

const type =
objectMap[searchValue];

if(!type){
alert("Object not found");
return;
}

if(type === "cube"){

activeObject = new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshNormalMaterial({
wireframe:true
})
);

}

if(type === "sphere"){

activeObject = new THREE.Mesh(
new THREE.SphereGeometry(
1,
32,
32
),
new THREE.MeshNormalMaterial({
wireframe:true
})
);

}

if(type === "cylinder"){

activeObject = new THREE.Mesh(
new THREE.CylinderGeometry(
1,
1,
2,
32
),
new THREE.MeshNormalMaterial({
wireframe:true
})
);

}

scene.add(activeObject);

};

function animateJarvis(){

requestAnimationFrame(
animateJarvis
);

if(activeObject){

activeObject.rotation.x += 0.01;
activeObject.rotation.y += 0.01;

}

renderer.render(
scene,
camera3D
);

}

animateJarvis();
document
.getElementById("searchBtn")
.onclick = () => {

const query =
document
.getElementById("searchBox")
.value
.toLowerCase()
.trim();

if(!query){
return;
}

const type =
objectMap[query];

if(!type){

alert("Object not found");

return;

}

document
.getElementById("objectType")
.value = type;

document
.getElementById("addObject")
.click();

};
window.addEventListener(
"resize",
() => {

camera3D.aspect =
window.innerWidth /
window.innerHeight;

camera3D.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);
</script>

</body>
</html>
